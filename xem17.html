const ACCOUNT_URL='https://script.google.com/macros/s/AKfycbxX8BXmNYxudSdGuB0kbqSkSSsCPfJm325GkTMpBHFWD8iT9GFCpNCff943vjuTSK1s/exec';
const $=id=>document.getElementById(id);let rows=[],fields=[],page=1;
function textNode(tag,text){const el=document.createElement(tag);el.textContent=text;return el}
async function verify(){const token=sessionStorage.getItem('viewerToken');if(!token)throw Error('Bạn cần đăng nhập lại từ index.html.');const r=await fetch(ACCOUNT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'validateViewer',token})});const data=await r.json();if(data.result!=='success')throw Error(data.message||'Phiên không hợp lệ.')}
function draw(){const key=$('search').value.toLowerCase();const filtered=rows.filter(row=>Object.values(row).some(v=>String(v??'').toLowerCase().includes(key)));const pages=Math.max(1,Math.ceil(filtered.length/50));page=Math.max(1,Math.min(page,pages));$('head').replaceChildren();const header=document.createElement('tr');fields.forEach(f=>header.append(textNode('th',f.fullLabel||f.label)));$('head').append(header);$('body').replaceChildren();filtered.slice((page-1)*50,page*50).forEach(row=>{const tr=document.createElement('tr');fields.forEach(f=>tr.append(textNode('td',row[f.id]??'')));$('body').append(tr)});$('page').textContent=`Trang ${page}/${pages} • ${filtered.length} dòng`;$('prev').disabled=page===1;$('next').disabled=page===pages}
async function load(){rows=[];fields=[];draw();$('status').textContent='Đang tải dữ liệu';try{await verify();const unit=UNITS.find(u=>u.id===$('unit').value);if(!unit.url)throw Error('Chưa có link ngành.');const read=async action=>{const r=await fetch(unit.url+'?action='+action);if(!r.ok)throw Error('Kết nối lỗi HTTP '+r.status);return r.json()};const [data,schema]=await Promise.all([read('getData'),read('getSchema').catch(()=>({}))]);if(!Array.isArray(data))throw Error(data.message||'Không đọc được dữ liệu');fields=(schema.fields||schema.groups?.flatMap(g=>g.fields)||unit.fallback.flatMap(g=>g.fields)).map((f,i)=>({...f,id:f.id||f.key||'c'+(i+1)}));if(!fields.length&&data.length)fields=Object.keys(data[0]).filter(k=>/^c\d+$/.test(k)).sort((a,b)=>Number(a.slice(1))-Number(b.slice(1))).map(k=>({id:k,label:'Cột '+k.slice(1)}));rows=data;page=1;draw();$('status').textContent='Đã tải '+rows.length+' dòng.'}catch(error){$('status').textContent=error.message}}
UNITS.forEach(unit=>{const option=textNode('option',unit.name);option.value=unit.id;$('unit').append(option)});$('unit').onchange=load;$('reload').onclick=load;$('search').oninput=()=>{page=1;draw()};$('prev').onclick=()=>{page--;draw()};$('next').onclick=()=>{page++;draw()};$('logout').onclick=()=>{sessionStorage.clear();location.href='index.html'};load();
